[project]
name = "lineage"
version = "0.1.0"
description = "An agent that answers why Python works the way it does, from a FalkorDB graph of PEPs, people, decisions and CPython PRs"
authors = [
    { name = "Anmol", email = "anmolgupta.skp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8.0",
    "fastapi>=0.143.3",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
