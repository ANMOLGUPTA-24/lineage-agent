services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379", "3000:3000"]   # 3000 = FalkorDB Browser
    volumes: [falkordb-data:/var/lib/falkordb/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  ingest:   # one-shot: builds the graph from the cached public data, then exits
    build: .
    command: sh -c "make ingest"
    environment: [FALKORDB_HOST=falkordb]
    depends_on: {falkordb: {condition: service_healthy}}

  app:
    build: .
    ports: ["8000:8000"]
    env_file: [{path: .env, required: false}]
    environment: [FALKORDB_HOST=falkordb]
    depends_on:
      ingest: {condition: service_completed_successfully}

volumes:
  falkordb-data:
